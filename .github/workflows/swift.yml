name: Build JSC + Fuzzilli

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Fuzzilli
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Build Fuzzilli Docker image (JSC target)
        run: |
          cd Cloud/Docker
          # build.sh tự clone WebKit, apply patch, build JSC với REPRL, đóng gói vào image
          ./build.sh jsc

      - name: Extract jsc + FuzzilliCli from image
        run: |
          mkdir -p out
          # Tạo container tạm từ image vừa build, không chạy
          CONTAINER_ID=$(docker create fuzzilli)
          # Đường dẫn bên trong image theo Dockerfile của Fuzzilli:
          #   /home/builder/Fuzzilli        -> FuzzilliCli
          #   /home/builder/jsc/jsc         -> jsc có REPRL
          docker cp "$CONTAINER_ID":/home/builder/Fuzzilli ./out/FuzzilliCli
          docker cp "$CONTAINER_ID":/home/builder/jsc/jsc ./out/jsc
          docker rm "$CONTAINER_ID"
          chmod +x ./out/FuzzilliCli ./out/jsc
          ls -lah ./out/

      - name: Verify REPRL symbols
        run: |
          strings ./out/jsc | grep -i -E 'fuzzilli|reprl' | head -n 20 || echo "WARN: no reprl symbols found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsc-fuzzilli-binaries
          path: out/
          retention-days: 30

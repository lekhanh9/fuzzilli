name: Build JSC + Fuzzilli

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Cấu hình 4-core 
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Fuzzilli
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Patch Dockerfiles
        run: |
          set -euo pipefail
          FB=Cloud/Docker/FuzzilliBuilder/Dockerfile
          if [ -f "$FB" ]; then sed -i 's/swift test && swift build -c release/swift build -c release/' "$FB"; fi
          
          JB=Cloud/Docker/JSCBuilder/Dockerfile
          if [ -f "$JB" ]; then sed -i 's/apt-get reinstall libicu-dev/apt-get reinstall -y libicu-dev/' "$JB"; fi
          
          for f in Cloud/Docker/*/Dockerfile Cloud/Docker/Dockerfile; do
            [ -f "$f" ] || continue
            if grep -q '^FROM' "$f" && ! grep -q 'DEBIAN_FRONTEND' "$f"; then
              sed -i '/^FROM/a ENV DEBIAN_FRONTEND=noninteractive' "$f"
            fi
          done

      - name: Build Fuzzilli Docker image (JSC target)
        run: |
          cd Cloud/Docker
          ./build.sh jsc

      - name: Locate and Extract Binaries
        run: |
          set -euo pipefail
          mkdir -p out/lib out/lib/swift
          
          # 1. Tìm file jsc
          if [ -f "Cloud/Docker/out/jsc" ]; then
              echo "Tìm thấy jsc từ build.sh."
              cp "Cloud/Docker/out/jsc" ./out/jsc
              JSC_PATH="/home/builder/webkit/WebKitBuild/Release/bin/jsc"
          else
              echo "Không thấy Cloud/Docker/out/jsc, tìm trong Docker image..."
              IMAGE=jsc_builder:latest
              JSC_PATH=$(docker run --rm "$IMAGE" find /home/builder/webkit -type f -name 'jsc' 2>/dev/null | head -n 1 || true)
              if [ -z "$JSC_PATH" ]; then
                  echo "ERROR: Không tìm thấy jsc!"
                  exit 1
              fi
              CONTAINER_ID=$(docker create "$IMAGE")
              docker cp "$CONTAINER_ID":"$JSC_PATH" ./out/jsc
              docker rm "$CONTAINER_ID"
          fi
          chmod +x ./out/jsc
          
          # 2. Tìm FuzzilliCli
          if [ -f "fuzzilli/.build/release/FuzzilliCli" ]; then
              cp "fuzzilli/.build/release/FuzzilliCli" ./out/FuzzilliCli
          else
              IMAGE_FUZZ=fuzzilli
              FUZZ_PATH=$(docker run --rm "$IMAGE_FUZZ" find /home/builder -type f -name 'Fuzzilli' 2>/dev/null | head -n 1 || true)
              if [ -n "$FUZZ_PATH" ]; then
                  CONTAINER_ID=$(docker create "$IMAGE_FUZZ")
                  docker cp "$CONTAINER_ID":"$FUZZ_PATH" ./out/FuzzilliCli
                  docker rm "$CONTAINER_ID"
              fi
          fi
          [ -f "./out/FuzzilliCli" ] && chmod +x ./out/FuzzilliCli

          # 3. Copy thư viện
          IMAGE_LIB=jsc_builder:latest
          CONTAINER_ID=$(docker create "$IMAGE_LIB")
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          LIBS=$(docker run --rm "$IMAGE_LIB" ldd "$JSC_PATH" 2>/dev/null | awk '/=>/ && $3 ~ /^\// {print $3}' || true)
          for lib in $LIBS; do
            case "$lib" in
              /lib/x86_64-linux-gnu/*|/lib64/*|/usr/lib/x86_64-linux-gnu/libc.so*|/usr/lib/x86_64-linux-gnu/libm.so*|/usr/lib/x86_64-linux-gnu/libpthread.so*|/usr/lib/x86_64-linux-gnu/libdl.so*|/usr/lib/x86_64-linux-gnu/librt.so*) continue ;;
            esac
            dest="out/lib/$(basename "$lib")"
            [ -f "$dest" ] || docker cp "$CONTAINER_ID":"$lib" "$dest" 2>/dev/null || true
          done

          if [ -f "fuzzilli/.build/release/FuzzilliCli" ]; then
            mkdir -p ./out/lib/swift-linux
            sudo cp -a /usr/lib/swift/linux/* ./out/lib/swift-linux/ 2>/dev/null || true
          fi
          
          echo "---- Nội dung out/ ----"
          ls -lah out/ out/lib/

      - name: Zip Output
        run: |
          cd out
          zip -r ../jsc-fuzzilli-linux-x64.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsc-fuzzilli-binaries
          path: jsc-fuzzilli-linux-x64.zip
          retention-days: 30

name: Build JSC + Fuzzilli (Ubuntu 24.04)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Chạy trên đúng bản Ubuntu 24.04 để khớp với Codespace
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Fuzzilli
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Patch Dockerfiles
        run: |
          set -euo pipefail
          # 1. Ép dùng Swift 6.0 bản Noble (Ubuntu 24.04) để tương thích GLIBC
          sed -i 's/FROM swift:latest/FROM swift:6.0-noble/' Cloud/Docker/JSCBuilder/Dockerfile
          sed -i 's/FROM swift:latest/FROM swift:6.0-noble/' Cloud/Docker/FuzzilliBuilder/Dockerfile

          # 2. Fix lỗi apt-get reinstall bị kẹt Y/n
          sed -i 's/apt-get reinstall libicu-dev/apt-get reinstall -y libicu-dev/' Cloud/Docker/JSCBuilder/Dockerfile
          
          # 3. Bỏ swift test (vì nó hay bị fail do test suite của Fuzzilli)
          sed -i 's/swift test && swift build -c release/swift build -c release/' Cloud/Docker/FuzzilliBuilder/Dockerfile

          # 4. Thêm ENV non-interactive cho tất cả Dockerfile
          for f in Cloud/Docker/*/Dockerfile Cloud/Docker/Dockerfile; do
            [ -f "$f" ] || continue
            if grep -q '^FROM' "$f" && ! grep -q 'DEBIAN_FRONTEND' "$f"; then
              sed -i '/^FROM/a ENV DEBIAN_FRONTEND=noninteractive' "$f"
            fi
          done

      - name: Build JSC
        run: |
          cd Cloud/Docker
          ./build.sh jsc

      - name: Build FuzzilliCli natively
        run: |
          set -euo pipefail
          mkdir -p out/lib out/lib/swift
          # Build FuzzilliCli bằng Docker image swift:6.0-noble
          docker run --rm -v "$PWD:/src" -w /src swift:6.0-noble \
            bash -c "apt-get update && apt-get install -y libcurl4-openssl-dev libxml2-dev && swift build -c release"
          
          cp .build/release/FuzzilliCli ./out/FuzzilliCli
          chmod +x ./out/FuzzilliCli

      - name: Extract JSC and Libraries
        run: |
          set -euo pipefail
          
          # 1. Lấy jsc từ build.sh
          cp Cloud/Docker/out/jsc ./out/jsc
          chmod +x ./out/jsc

          # 2. Tạo container từ image jsc_builder để lấy thư viện ICU
          IMAGE=jsc_builder:latest
          docker create --name temp_jsc "$IMAGE"
          
          # Copy các thư viện ICU chuẩn (bản 74 của Ubuntu 24.04)
          docker cp temp_jsc:/usr/lib/x86_64-linux-gnu/libicuuc.so.74 ./out/lib/ 2>/dev/null || true
          docker cp temp_jsc:/usr/lib/x86_64-linux-gnu/libicudata.so.74 ./out/lib/ 2>/dev/null || true
          docker cp temp_jsc:/usr/lib/x86_64-linux-gnu/libicui18n.so.74 ./out/lib/ 2>/dev/null || true
          docker cp temp_jsc:/usr/lib/x86_64-linux-gnu/libatomic.so.1 ./out/lib/ 2>/dev/null || true
          
          # Copy toàn bộ Swift runtime (để FuzzilliCli chạy được)
          docker create --name temp_swift swift:6.0-noble
          docker cp temp_swift:/usr/lib/swift/linux ./out/lib/swift-linux
          
          docker rm -f temp_jsc temp_swift

      - name: Zip Output
        run: |
          cd out
          zip -r ../jsc-fuzzilli-linux-x64.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsc-fuzzilli-binaries
          path: jsc-fuzzilli-linux-x64.zip
          retention-days: 30

name: Build JSC + Fuzzilli

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Fuzzilli
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Restore Docker image cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: ~/.cache/fuzzilli-image
          key: fuzzilli-image-${{ hashFiles('Cloud/Docker/JSCBuilder/Dockerfile', 'Cloud/Docker/FuzzilliBuilder/Dockerfile', 'Cloud/Docker/build.sh', 'Targets/JavaScriptCore/REVISION') }}

      - name: Load cached Docker image
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/fuzzilli-image
          if [ -f ~/.cache/fuzzilli-image/jsc_builder.tar ]; then
            echo "Loading cached image..."
            docker load -i ~/.cache/fuzzilli-image/jsc_builder.tar
            echo "IMAGE_LOADED=true" >> "$GITHUB_ENV"
          else
            echo "IMAGE_LOADED=false" >> "$GITHUB_ENV"
          fi

      - name: Patch Dockerfiles
        run: |
          set -euo pipefail
          FB=Cloud/Docker/FuzzilliBuilder/Dockerfile
          if [ -f "$FB" ]; then sed -i 's/swift test && swift build -c release/swift build -c release/' "$FB"; fi
          
          JB=Cloud/Docker/JSCBuilder/Dockerfile
          if [ -f "$JB" ]; then sed -i 's/apt-get reinstall libicu-dev/apt-get reinstall -y libicu-dev/' "$JB"; fi
          
          for f in Cloud/Docker/*/Dockerfile Cloud/Docker/Dockerfile; do
            [ -f "$f" ] || continue
            if grep -q '^FROM' "$f" && ! grep -q 'DEBIAN_FRONTEND' "$f"; then
              sed -i '/^FROM/a ENV DEBIAN_FRONTEND=noninteractive' "$f"
            fi
          done

      - name: Build JSC Image
        if: env.IMAGE_LOADED != 'true'
        run: |
          cd Cloud/Docker
          ./build.sh jsc

      - name: Save Image to Cache
        if: always()
        run: |
          set -euo pipefail
          if docker image inspect jsc_builder:latest >/dev/null 2>&1; then
            echo "Saving image to cache..."
            docker save -o ~/.cache/fuzzilli-image/jsc_builder.tar jsc_builder:latest
          fi

      - name: Locate and Extract Binaries
        run: |
          set -euo pipefail
          mkdir -p out/lib out/lib/swift
          IMAGE=jsc_builder:latest
          docker image inspect "$IMAGE" >/dev/null 2>&1 || IMAGE=fuzzilli
          
          CONTAINER_ID=$(docker create "$IMAGE")
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          
          # Tự động dò tìm đường dẫn thật của jsc và Fuzzilli bên trong container
          JSC_PATH=$(docker run --rm "$IMAGE" find / -type f -name 'jsc' 2>/dev/null | grep -E 'WebKitBuild|Fuzzilli' | head -n 1)
          if [ -z "$JSC_PATH" ]; then JSC_PATH=$(docker run --rm "$IMAGE" find / -type f -name 'jsc' 2>/dev/null | head -n 1); fi
          
          FUZZ_PATH=$(docker run --rm "$IMAGE" find / -type f -name 'Fuzzilli' 2>/dev/null | grep -E '\.build|release' | head -n 1)
          if [ -z "$FUZZ_PATH" ]; then FUZZ_PATH=$(docker run --rm "$IMAGE" find / -type f -name 'Fuzzilli' 2>/dev/null | head -n 1); fi
          
          if [ -z "$JSC_PATH" ] || [ -z "$FUZZ_PATH" ]; then
            echo "ERROR: Không tìm thấy file binary!"
            docker run --rm "$IMAGE" find /home/builder -type f | head -n 50
            exit 1
          fi
          
          echo "Đã tìm thấy:"
          echo "jsc: $JSC_PATH"
          echo "Fuzzilli: $FUZZ_PATH"
          
          docker cp "$CONTAINER_ID":"$JSC_PATH" ./out/jsc
          docker cp "$CONTAINER_ID":"$FUZZ_PATH" ./out/FuzzilliCli
          chmod +x ./out/jsc ./out/FuzzilliCli
          
          # Copy thư viện
          for bin in "$JSC_PATH" "$FUZZ_PATH"; do
            LIBS=$(docker run --rm "$IMAGE" ldd "$bin" 2>/dev/null | awk '/=>/ && $3 ~ /^\// {print $3}' || true)
            for lib in $LIBS; do
              case "$lib" in
                /lib/x86_64-linux-gnu/*|/lib64/*|/usr/lib/x86_64-linux-gnu/libc.so*|/usr/lib/x86_64-linux-gnu/libm.so*|/usr/lib/x86_64-linux-gnu/libpthread.so*|/usr/lib/x86_64-linux-gnu/libdl.so*|/usr/lib/x86_64-linux-gnu/librt.so*) continue ;;
              esac
              dest="out/lib/$(basename "$lib")"
              [ -f "$dest" ] || docker cp "$CONTAINER_ID":"$lib" "$dest" 2>/dev/null || true
            done
          done
          
          SWIFT_LIBS=$(docker run --rm "$IMAGE" ldd "$FUZZ_PATH" 2>/dev/null | awk '/libswift|libdispatch|libFoundation|libBlocksRuntime/ && $3 ~ /^\// {print $3}' || true)
          for lib in $SWIFT_LIBS; do
            dest="out/lib/swift/$(basename "$lib")"
            [ -f "$dest" ] || docker cp "$CONTAINER_ID":"$lib" "$dest" 2>/dev/null || true
          done
          
          docker cp "$CONTAINER_ID":/usr/lib/swift/linux ./out/lib/swift-linux 2>/dev/null || true

      - name: Zip Output
        run: |
          cd out
          zip -r ../jsc-fuzzilli-linux-x64.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsc-fuzzilli-binaries
          path: jsc-fuzzilli-linux-x64.zip
          retention-days: 30
